<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 15px;
      text-align: center;
    }
    nav {
      background: #333;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    section {
      padding: 40px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 20px auto;
      width: 80%;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
  <p>This is my first website</p>
</header>

<nav>
  <a href="#home">Home</a>
  <a href="#about">About</a>
  <a href="#contact">Contact</a>
</nav>

<section id="home">
  <div class="card">
    <h2>Home</h2>
    <p>Hello! This is my website. I created it using GitHub Pages.</p>
  </div>
</section>

<section id="about">
  <div class="card">
    <h2>About Me</h2>
    <p>My name is Dnyaneshwar. I am learning web development.</p>
  </div>
</section>

<section id="contact">
  <div class="card">
    <h2>Contact</h2>
    <p>Email: example@gmail.com</p>
    <p>Phone: 1234567890</p>
  </div>
</section>

<footer>
  <p>© 2026 My Website</p>
</footer>

</body>
</html>
